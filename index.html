<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Shepherd's Guild</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      color: #e8e0d4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 640px;
      padding: 2rem;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 600;
      color: #c9a227;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: #a89a7e;
      margin-bottom: 3rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .links a {
      display: block;
      width: 100%;
      max-width: 360px;
      padding: 1rem 1.5rem;
      background: rgba(201, 162, 39, 0.08);
      border: 1px solid rgba(201, 162, 39, 0.25);
      border-radius: 8px;
      color: #e8e0d4;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .links a:hover {
      background: rgba(201, 162, 39, 0.15);
      border-color: rgba(201, 162, 39, 0.5);
      transform: translateY(-1px);
    }

    .links a .desc {
      display: block;
      font-size: 0.8rem;
      color: #a89a7e;
      margin-top: 0.25rem;
      font-weight: 400;
    }

    .footer {
      margin-top: 4rem;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">The Shepherd's Guild</div>
    <div class="tagline">Sermon analytics for the men who preach the Word</div>

    <div class="links">
      <a href="/showcasev4.html">
        My Dashboard
        <span class="desc">Preacher coaching profile &amp; analytics</span>
      </a>
      <a href="/guild-hall-dashboard.html">
        The Guild Hall
        <span class="desc">Cross-preacher comparison &amp; benchmarks</span>
      </a>
    </div>

    <div class="footer">&copy; 2026 The Shepherd's Guild</div>
  </div>
</body>
</html>
